name: ${COMPOSE_PROJECT_NAME:-convyn}
x-runtime: &runtime
  restart: unless-stopped
  mem_limit: 768m
  pids_limit: 256
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ['/tmp:size=64m,mode=1777']
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '3'
x-build: &build
  context: ../..
  dockerfile: infrastructure/docker/Dockerfile
services:
  postgres:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: convyn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate the deployment environment file}
      POSTGRES_DB: convyn
    volumes: ['postgres_data:/var/lib/postgresql/data']
    networks: [data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U convyn -d convyn']
      interval: 5s
      timeout: 5s
      retries: 30
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }
  redis:
    image: redis:7.4-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    restart: unless-stopped
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Generate the deployment environment file}
    command:
      [
        'sh',
        '-c',
        'exec redis-server --appendonly yes --requirepass "$$REDISCLI_AUTH"',
      ]
    volumes: ['redis_data:/data']
    networks: [data]
    healthcheck:
      test: ['CMD-SHELL', 'test "$$(redis-cli ping)" = PONG']
      interval: 5s
      timeout: 5s
      retries: 30
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }
  tools:
    pull_policy: never
    image: convyn-tools:${RELEASE_TAG:?Set RELEASE_TAG to the Git commit}
    build:
      <<: *build
      target: tools
    user: node
    environment:
      NODE_ENV: production
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?Regenerate deployment configuration or add a runtime DB secret}
      DATABASE_URL: postgresql://convyn:${POSTGRES_PASSWORD}@postgres:5432/convyn
    networks: [data]
    volumes: [uploads_data:/app/uploads:ro]
    profiles: [tools]
    depends_on:
      postgres: { condition: service_healthy }
  api:
    <<: *runtime
    pull_policy: never
    image: convyn-api:${RELEASE_TAG}
    build:
      <<: *build
      target: api
    environment:
      NODE_ENV: production
      PORT: '4000'
      TRUST_PROXY: '1'
      FILE_UPLOAD_ROOT: /app/uploads
      APP_ORIGIN: ${APP_ORIGIN:-https://www.convyn.cloud}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      OAUTH_STATE_SECRET: ${OAUTH_STATE_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      DATABASE_URL: postgresql://convyn_app:${APP_DATABASE_PASSWORD}@postgres:5432/convyn
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      WEB_ORIGINS: https://${CUSTOMER_DOMAIN},https://${PROVIDER_DOMAIN},https://${ADMIN_DOMAIN},https://${BUSINESS_DOMAIN},https://${ENTERPRISE_DOMAIN}
    volumes: [uploads_data:/app/uploads]
    networks: [data, app]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  customer:
    <<: *runtime
    pull_policy: never
    image: convyn-customer:${RELEASE_TAG}
    build:
      <<: *build
      target: web
      args: { WEB_APP: customer-web }
    tmpfs:
      [
        '/tmp:size=64m,mode=1777',
        '/app/apps/customer-web/.next/cache:size=64m,uid=1000,gid=1000,mode=0700',
      ]
    networks: [app]
  provider:
    <<: *runtime
    pull_policy: never
    image: convyn-provider:${RELEASE_TAG}
    build:
      <<: *build
      target: web
      args: { WEB_APP: provider-web }
    tmpfs:
      [
        '/tmp:size=64m,mode=1777',
        '/app/apps/provider-web/.next/cache:size=64m,uid=1000,gid=1000,mode=0700',
      ]
    networks: [app]
  admin:
    <<: *runtime
    pull_policy: never
    image: convyn-admin:${RELEASE_TAG}
    build:
      <<: *build
      target: web
      args: { WEB_APP: admin-web }
    tmpfs:
      [
        '/tmp:size=64m,mode=1777',
        '/app/apps/admin-web/.next/cache:size=64m,uid=1000,gid=1000,mode=0700',
      ]
    networks: [app]
  business:
    <<: *runtime
    pull_policy: never
    image: convyn-business:${RELEASE_TAG}
    build:
      <<: *build
      target: web
      args: { WEB_APP: business-web }
    tmpfs:
      [
        '/tmp:size=64m,mode=1777',
        '/app/apps/business-web/.next/cache:size=64m,uid=1000,gid=1000,mode=0700',
      ]
    networks: [app]
  enterprise:
    <<: *runtime
    pull_policy: never
    image: convyn-enterprise:${RELEASE_TAG}
    build:
      <<: *build
      target: web
      args: { WEB_APP: enterprise-web }
    tmpfs:
      [
        '/tmp:size=64m,mode=1777',
        '/app/apps/enterprise-web/.next/cache:size=64m,uid=1000,gid=1000,mode=0700',
      ]
    networks: [app]
  edge:
    image: caddy:2-alpine@sha256:e70b164da81ef698b3ad19af799ea6086ce6d9e48ed4079eb9fe26f6fbf14ee5
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    environment:
      NO_PROXY: localhost,127.0.0.1,api,customer,provider,admin,business,enterprise
      no_proxy: localhost,127.0.0.1,api,customer,provider,admin,business,enterprise
      TLS_EMAIL: ${TLS_EMAIL:?Set TLS_EMAIL}
      CUSTOMER_DOMAIN: ${CUSTOMER_DOMAIN:?Set CUSTOMER_DOMAIN}
      PROVIDER_DOMAIN: ${PROVIDER_DOMAIN:?Set PROVIDER_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?Set ADMIN_DOMAIN}
      BUSINESS_DOMAIN: ${BUSINESS_DOMAIN:?Set BUSINESS_DOMAIN}
      ENTERPRISE_DOMAIN: ${ENTERPRISE_DOMAIN:?Set ENTERPRISE_DOMAIN}
    ports: ['${EDGE_BIND:-127.0.0.1}:80:80', '${EDGE_BIND:-127.0.0.1}:443:443']
    volumes:
      [
        './Caddyfile:/etc/caddy/Caddyfile:ro',
        'caddy_data:/data',
        'caddy_config:/config',
      ]
    tmpfs: ['/tmp:size=16m']
    networks: [app]
    depends_on:
      api: { condition: service_healthy }
      customer: { condition: service_healthy }
      provider: { condition: service_healthy }
      admin: { condition: service_healthy }
      business: { condition: service_healthy }
      enterprise: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'http_proxy= https_proxy= HTTP_PROXY= HTTPS_PROXY= wget -qO- http://127.0.0.1:8080/healthz',
        ]
      interval: 15s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }
networks:
  data: { internal: true }
  app: {}
volumes:
  uploads_data:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
