name: Marketplace checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: convyn
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: convyn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U convyn -d convyn"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://convyn:ci_only_password@localhost:5432/convyn
      CHROMIUM_PATH: /usr/bin/chromium
      EXPO_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: node -e "require('node:fs').writeFileSync('.env', 'DATABASE_URL='+process.env.DATABASE_URL+'\n')"
      - run: pnpm db:generate
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:integration
      - run: pnpm test:contract
      - run: pnpm exec playwright install --with-deps chromium
      - run: CHROMIUM_PATH='' pnpm test:web
        env:
          USE_PLAYWRIGHT_BROWSER: '1'
      - run: CHROMIUM_PATH='' USE_PLAYWRIGHT_BROWSER=1 pnpm test:marketplace-web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/

  dependency-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm audit --prod --audit-level=high
